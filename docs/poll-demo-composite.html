<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Poll Website — Design Preview Composite</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{ --ink:#0B0B0C; --lime:#0FFF00; }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1600px;height:1000px;overflow:hidden}
  body{
    font-family:Inter,sans-serif;background:var(--ink);color:#fff;
    background-image:
      radial-gradient(rgba(255,255,255,.022) 1px, transparent 1px),
      radial-gradient(80% 55% at 30% -5%, rgba(79,70,229,.18), transparent 60%),
      radial-gradient(45% 35% at 100% 100%, rgba(15,255,0,.06), transparent 60%);
    background-size:36px 36px, 100% 100%, 100% 100%;
    padding:42px 56px 26px;display:flex;flex-direction:column;
  }
  .hd{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:30px}
  .hd h1{font-family:Unbounded;font-weight:700;font-size:27px;letter-spacing:-.3px}
  .hd h1 em{font-style:normal;color:var(--lime)}
  .hd p{font-size:14.5px;color:#a8a8a8;margin-top:8px;font-weight:500}
  .tag{font-size:11.5px;letter-spacing:3px;text-transform:uppercase;font-weight:800;color:var(--lime);border:1px solid rgba(15,255,0,.4);border-radius:20px;padding:8px 16px;background:rgba(15,255,0,.06)}

  .stage{display:flex;gap:38px;align-items:flex-start;flex:1}

  /* browser frame */
  .browser{width:952px;border-radius:14px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.65), 0 0 0 1px rgba(255,255,255,.09)}
  .bbar{height:40px;background:#1C1C22;display:flex;align-items:center;padding:0 16px;gap:8px}
  .dotc{width:11px;height:11px;border-radius:50%}
  .dotc.r{background:#FF5F57}.dotc.y{background:#FEBC2E}.dotc.g{background:#28C840}
  .url{margin:0 auto;background:#2A2A32;border-radius:8px;height:26px;display:flex;align-items:center;justify-content:center;padding:0 60px;font-size:12px;color:#B9B9C6;font-weight:500;gap:7px}
  .url svg{width:10px;height:10px}
  .browser img{display:block;width:100%}

  /* phone frames */
  .phones{display:flex;gap:26px}
  .pcol{display:flex;flex-direction:column;gap:14px;align-items:center}
  .pframe{width:236px;height:498px;border-radius:32px;border:7px solid #1E1E26;overflow:hidden;background:#fff;box-shadow:0 26px 70px rgba(0,0,0,.65), 0 0 0 1px rgba(255,255,255,.08);position:relative}
  .pframe img{display:block;width:100%}
  .plbl{font-size:11.5px;letter-spacing:2px;text-transform:uppercase;color:#9a9a9a;font-weight:800}
  .plbl b{color:var(--lime);margin-right:5px}

  .foot{display:flex;justify-content:space-between;align-items:center;margin-top:26px}
  .b24{font-family:Unbounded;font-weight:700;font-size:17px;display:flex;align-items:center;gap:8px}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--lime);box-shadow:0 0 12px 1px var(--lime)}
  .ft{font-size:13px;color:#9a9a9a;font-weight:500}
</style>
</head>
<body>

  <div class="hd">
    <div>
      <h1>Your poll website — <em>design preview</em></h1>
      <p>Responsive desktop + mobile · vote → sponsor ad → live results · admin dashboard for categories, polls, ads &amp; analytics</p>
    </div>
    <div class="tag">Design Preview</div>
  </div>

  <div class="stage">
    <div class="browser">
      <div class="bbar">
        <span class="dotc r"></span><span class="dotc y"></span><span class="dotc g"></span>
        <div class="url">🔒 yourpollsite.in</div>
      </div>
      <img src="file:///Users/prabhas/24dev/docs/proposal-export/poll-desktop-vote.png" alt="">
    </div>

    <div class="phones">
      <div class="pcol">
        <div class="pframe"><img src="file:///Users/prabhas/24dev/docs/proposal-export/poll-mobile-vote.png" alt=""></div>
        <div class="plbl"><b>1</b> Vote</div>
      </div>
      <div class="pcol">
        <div class="pframe"><img src="file:///Users/prabhas/24dev/docs/proposal-export/poll-mobile-results.png" alt=""></div>
        <div class="plbl"><b>2</b> Live results</div>
      </div>
    </div>
  </div>

  <div class="foot">
    <div class="b24">24dev<span class="dot"></span></div>
    <div class="ft">design preview · full build in 5 days · ₹10,000 · CMS + hosting included</div>
  </div>

</body>
</html>
